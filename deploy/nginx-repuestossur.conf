# HTTP: todo se redirige a HTTPS (las credenciales nunca viajan en claro).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS. Mientras no haya un dominio público se usa un certificado autofirmado
# generado con deploy/generar_certificado_autofirmado.sh. Si se obtiene un
# dominio, reemplazar las dos líneas ssl_certificate por los archivos de
# Certbot/ALB y mantener el resto igual.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/repuestossur.crt;
    ssl_certificate_key /etc/nginx/ssl/repuestossur.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescribir (no concatenar): el cliente no puede falsificar la IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
