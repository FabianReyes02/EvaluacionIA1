<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repuestos Sur — Crear cuenta</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--muted:#66768a;--line:#e3e8ee;--brand:#0b5cff;--bad:#c0392b;--ok:#128a4b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:grid;place-items:center;min-height:100vh}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(380px,92vw);
        box-shadow:0 8px 30px rgba(20,40,70,.06)}
  h1{margin:0 0 4px;font-size:20px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fbfcfe}
  input:focus{outline:2px solid #cfe0ff;border-color:var(--brand)}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--brand);
         color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#0846c4}
  .msg{font-size:13px;margin-top:12px;min-height:20px}
  .error{color:var(--bad)} .ok{color:var(--ok)}
  .foot{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
  a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<section class="card">
  <h1>🚗 Repuestos Sur</h1>
  <div class="sub">Crear cuenta de cliente</div>
  <form id="form">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required placeholder="3-32 caracteres">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="mínimo 10 caracteres">
    <label for="confirm">Repetir contraseña</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <button type="submit">Crear cuenta</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></div>
</section>
<script>
const $ = (id) => document.getElementById(id);
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("msg").textContent = "";
  $("msg").className = "msg";
  if ($("password").value !== $("confirm").value) {
    $("msg").textContent = "Las contraseñas no coinciden.";
    $("msg").className = "msg error";
    return;
  }
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const res = await fetch("/api/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("username").value, password: $("password").value})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    $("msg").textContent = "Cuenta creada. Redirigiendo al login…";
    $("msg").className = "msg ok";
    setTimeout(() => { location.href = "/login"; }, 900);
  } catch (err) {
    $("msg").textContent = err.message;
    $("msg").className = "msg error";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
